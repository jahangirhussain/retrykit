[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrykit"
version = "0.1.0"
description = "Tiny, dependency-free retries with exponential backoff and full jitter."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
